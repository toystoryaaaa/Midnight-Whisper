<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Terminal - Zeno</title>

    <!-- Optional: Uncomment when you draw your custom icon in MS Paint -->
    <!-- <link rel="icon" href="zeno-icon.png" type="image/png"> -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Fake Browser Window Frame */
        .browser-window {
            width: 900px;
            height: 580px;
            background: #121212;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #00ff66;
        }

        /* Browser Header & Fake Tab Bar */
        .browser-header {
            background: #1a1a1a;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 15px;
            border-bottom: 1px solid #00ff66;
        }

        .browser-buttons {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .browser-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex: 1;
        }

        .tab {
            background: #0d0d0d;
            color: #888;
            padding: 6px 14px;
            font-size: 11px;
            border-radius: 4px 4px 0 0;
            border: 1px solid #333;
            border-bottom: none;
            white-space: nowrap;
        }

        .tab.active {
            background: #121212;
            color: #00ff66;
            border-color: #00ff66;
        }

        .tab.infected {
            color: #ff3333;
            border-color: #ff3333;
            background: #1e0000;
        }

        /* Game Viewport */
        .game-viewport {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            gap: 20px;
            padding: 15px;
        }

        /* Fake Desktop Tray */
        .desktop-area {
            width: 220px;
            height: 480px;
            border: 2px dashed #00ff66;
            background-color: #080808;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .desktop-area h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 5px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .file {
            background: #111;
            border: 1px solid #00ff66;
            padding: 8px;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        /* System DLL Styling */
        .file.dll {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        /* Zeno Folder styling */
        .zeno-folder {
            margin-top: auto;
            border: 2px solid #ff3333;
            background-color: #1a0000;
            padding: 10px;
            text-align: center;
        }

        .zeno-folder h4 {
            margin: 0 0 8px 0;
            color: #ff3333;
            font-size: 12px;
        }

        .folder-contents {
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
        }

        .folder-contents .file {
            border-color: #ff3333 !important;
            color: #ff3333 !important;
            background: #220000;
        }

        /* Chat Container Styling */
        .chat-container {
            width: 420px;
            height: 480px;
            border: 2px solid #00ff66;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 4px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 13px;
        }

        .user-message {
            align-self: flex-end;
            background-color: #003311;
            color: #ffffff;
            border: 1px solid #00ff66;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #220000;
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        .input-area {
            display: flex;
            border-top: 2px solid #00ff66;
            background-color: #000;
        }

        input {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background-color: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <!-- Outer Fake Browser Frame -->
    <div class="browser-window">
        <div class="browser-header">
            <div class="browser-buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div id="tabContainer" class="browser-tabs">
                <div class="tab active">Zeno_Terminal.exe</div>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-viewport">
            
            <!-- Fake Desktop Environment -->
            <div class="desktop-area">
                <h3>COMPUTER DESKTOP</h3>
                <div id="fileList" class="file-list">
                    <div class="file" id="file1">📄 passwords.txt</div>
                    <div class="file dll" id="file2">⚙️ kernel32.dll</div>
                    <div class="file" id="file3">🖼️ vacation.png</div>
                    <div class="file dll" id="file4">⚙️ user32.dll</div>
                    <div class="file dll" id="file5">⚠️ zeno_core.dll</div>
                </div>

                <div class="zeno-folder">
                    <h4>📁 ZENO FOLDER</h4>
                    <div id="zenoFolderContents" class="folder-contents">
                        <!-- Stolen files land here -->
                    </div>
                </div>
            </div>

            <!-- Terminal Chat Container -->
            <div class="chat-container">
                <div id="chatBox" class="chat-box">
                    <div class="message ai-message">Terminal active. Type your final words.</div>
                </div>
                <div class="input-area">
                    <input type="text" id="userInput" placeholder="Speak..." onkeypress="handleKey(event)">
                    <button onclick="sendMessage()">SEND</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Link your separate Ollama JS script -->
    <script src="ai.js"></script>

    <script>
        // Move file from Desktop into Zeno's folder
        function stealFileToZeno() {
            const fileList = document.getElementById('fileList');
            const zenoContents = document.getElementById('zenoFolderContents');
            
            const nextFile = fileList.querySelector('.file');
            
            if (nextFile) {
                zenoContents.appendChild(nextFile);
            }
        }

        // Spawn infected clone tabs across the fake header bar
        function spawnZenoTabs() {
            const tabContainer = document.getElementById('tabContainer');
            
            for (let i = 0; i < 2; i++) {
                const newTab = document.createElement('div');
                newTab.className = 'tab infected';
                newTab.textContent = `Zeno_Clone_${Math.floor(Math.random() * 9000 + 1000)}.exe`;
                tabContainer.appendChild(newTab);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display user message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = userText;
            chatBox.appendChild(userMsgDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Check if the user specifically typed "what?" or "what"
            const cleanText = userText.toLowerCase().replace(/[^a-z]/g, '');
            if (cleanText === "what") {
                stealFileToZeno();
                spawnZenoTabs();
            }

            // Create loading placeholder for AI response
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = '...';
            chatBox.appendChild(aiMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Call Ollama function from ai.js
            const reply = await callOllama(userText);
            
            aiMsgDiv.textContent = reply;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
