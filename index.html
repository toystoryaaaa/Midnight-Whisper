<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Terminal - Zeno</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }

        /* Fake Desktop Tray */
        .desktop-area {
            width: 220px;
            height: 500px;
            border: 2px dashed #00ff66;
            background-color: #080808;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .desktop-area h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 5px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file {
            background: #111;
            border: 1px solid #00ff66;
            padding: 8px;
            font-size: 12px;
            transition: all 0.4s ease;
        }

        /* Zeno Folder styling */
        .zeno-folder {
            margin-top: auto;
            border: 2px solid #ff3333;
            background-color: #1a0000;
            padding: 10px;
            text-align: center;
        }

        .zeno-folder h4 {
            margin: 0 0 8px 0;
            color: #ff3333;
            font-size: 13px;
        }

        .folder-contents {
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .folder-contents .file {
            border-color: #ff3333;
            color: #ff3333;
            background: #220000;
        }

        /* Chat Container Styling */
        .chat-container {
            width: 400px;
            height: 500px;
            border: 2px solid #00ff66;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 4px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #003311;
            color: #ffffff;
            border: 1px solid #00ff66;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #220000;
            color: #ff3333;
            border: 1px solid #ff3333;
        }
        .input-area {
            display: flex;
            border-top: 2px solid #00ff66;
            background-color: #000;
        }
        input {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        button:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div class="desktop-area">
        <h3>COMPUTER DESKTOP</h3>
        <div id="fileList" class="file-list">
            <div class="file" id="file1">📄 passwords.txt</div>
            <div class="file" id="file2">🖼️ vacation.png</div>
            <div class="file" id="file3">📊 budget_2026.xlsx</div>
        </div>

        <div class="zeno-folder">
            <h4>📁 ZENO FOLDER</h4>
            <div id="zenoFolderContents" class="folder-contents">
                </div>
        </div>
    </div>

    <div class="chat-container">
        <div id="chatBox" class="chat-box">
            <div class="message ai-message">Terminal active. Type your final words.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Speak..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script src="ai.js"></script>

    <script>
        function stealFileToZeno() {
            const fileList = document.getElementById('fileList');
            const zenoContents = document.getElementById('zenoFolderContents');
            
            // Find the first file available on the desktop
            const nextFile = fileList.querySelector('.file');
            
            if (nextFile) {
                // Move element visually from desktop list into the Zeno folder contents
                zenoContents.appendChild(nextFile);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display user message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = userText;
            chatBox.appendChild(userMsgDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Check if the user specifically said "what?" (ignoring casing)
            if (userText.toLowerCase() === "what?" || userText.toLowerCase() === "what") {
                stealFileToZeno();
            }

            // Create loading placeholder for AI response
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = '...';
            chatBox.appendChild(aiMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Call Ollama from your ai.js file
            const reply = await callOllama(userText);
            
            aiMsgDiv.textContent = reply;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
